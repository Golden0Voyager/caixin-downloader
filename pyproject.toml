[project]
name = "caixin-downloader"
version = "2.5"
description = "财新周刊全自动 EPUB 下载引擎：抓取已订阅内容并打包为离线电子书"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Haining", email = "yhn0535@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "pillow>=13.0.0",
    "playwright>=1.40",
    "questionary>=2.0",
    "rich>=13.0",
]

# 这是一个脚本项目，不是可安装的库：`uv run python main.py` 直接用源码树运行。
# 之前的配置声明了 uv_build + src/ 布局，但 src/caixin_downloader 里只有一句
# hello()，`uv build` 出来的 wheel 不含任何实际代码。
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 抓取层全是 async 函数，用 auto 模式可以直接写 `async def test_...`，
# 不必给每个用例贴 @pytest.mark.asyncio。
asyncio_mode = "auto"

[tool.coverage.run]
# 只统计产品代码。此前写的是 source = ["."] 且没排除测试，于是分母里混进了
# 三个接近 100% 覆盖的测试文件，总数被抬到 52%，而 main.py 实际只有 26%。
source = ["."]
omit = ["tests/*", "test_caixin.py"]
branch = true

[tool.coverage.report]
# 门槛设在当前水位（97%）下方留出余量：新增一两处未测分支不至于立刻红，
# 但成片退化一定会被 CI 拦住。抓取链路的 Playwright 交互已由 tests/fakes.py
# 的离线替身覆盖，不再是「只能人工点」的黑箱。
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
# 继承仓库内基线（见 .ruff-global.toml，镜像自 ~/.config/ruff/ruff.toml）。
# 不直接 extend 用户级路径：ruff 找不到被继承文件会硬失败，而 CI 上没有该文件。
extend = ".ruff-global.toml"

[tool.ruff.lint]
# 只声明与基线的差异：本项目额外放行多语句同行（E701/E702）与非 snake_case 模块名（N999）。
# E501 与 SIM102/103/108/117 的忽略已在基线里，不再重复。
extend-ignore = ["E701", "E702", "N999"]

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]
