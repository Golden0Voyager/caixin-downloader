[project]
name = "caixin-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haining", email = "yhn0535@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "playwright>=1.40",
    "questionary>=2.0",
    "rich>=13.0",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test_caixin.py"]

[tool.coverage.report]
# 个人实验 Demo 项目，870 行单体脚本深度绑定 Playwright，
# 核心风险来自外部网站而非代码逻辑。仅 create_epub 可单元测试，
# 余下代码需要重构才能达到更高覆盖率。
fail_under = 15
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E701", "E702", "N999"]

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]
